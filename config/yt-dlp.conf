# --- НАСТРОЙКИ ВИДЕО-ДВИЖКА (yt-dlp) ---
# Применяются на следующий запуск без пересборки образа.

# Формат и качество максимально возможное
-f "bv*+ba/b"
# Контейнер по умолчанию: mkv (вшитые субтитры, attachment-обложка, универсальность)
--merge-output-format mkv
--remux-video mkv

# Шаблон имени: Папка_канала/Название.mkv
-o "%(uploader)s/%(title)s.%(ext)s"

# Контракт с Python-движком (парсинг прогресса, коды возврата): не менять
--no-continue
--ignore-errors
--newline

# Субтитры ru/en: вшиваются в mkv как дорожки (внешние файлы не пишутся)
--write-subs
--write-auto-subs
--sub-langs ru,en
--convert-subs srt
--embed-subs
--no-write-subs

# Метаданные и обложка (в mkv: attachment через mkvmerge)
--embed-thumbnail
--embed-metadata

# --- Перекодирование в h265 (опционально) ---
# Механизм: родной постпроцессор yt-dlp. Перекодирование выполняется внутри процесса yt-dlp
# после склейки; watchdog не останавливает пост-фазы (механика silence_grace).
# ВАЖНО: перекодирование имеет смысл для h264-источников (Boosty/Rutube); YouTube-контент
# приходит в AV1/VP9 — перекодирование в h265 не даёт экономии.
# Раскомментировать одну из строк при потребности:
#--recode-video mp4
#--postprocessor-args "ffmpeg:-c:v libx265 -preset medium -crf 26 -c:a copy"
# Вариант fast (быстрее в 2-3 раза, размер +5-15%):
#--recode-video mp4
#--postprocessor-args "ffmpeg:-c:v libx265 -preset fast -crf 26 -c:a copy"

# SponsorBlock: вырезать все категории (stream-copy, без перекодирования)
--sponsorblock-remove all

# Антибан: паузы между служебными запросами и между видео плейлиста
# Пауза между запросами: 2 сек (при 1 сек YouTube рейт-лимитит субтитры — HTTP 429)
--sleep-requests 2
--sleep-interval 10
--max-sleep-interval 30

# EJS: скрипт-решатель JS-челленджей — локальная копия в образе (не зависит от сети сессии)
# EJS: решатель установлен в образ из npm-пакета (локально, без сети)
--remote-components ejs:github

# Публичные плейлисты качаются даже при протухших куках (18+ внутри — нет)
--extractor-args youtubetab:skip=authcheck
# PO-токен: локальный bgutil-провайдер (поднимается в контейнере на 4416)
--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"

# --- Опционально (раскомментировать вручную) ---
# Лимит скорости 5 МБ/с (бережность к сети при параллельных задачах на NAS)
#--limit-rate 5M
# Параллельные фрагменты HLS/DASH (ускорение, но рандомный I/O на RAID)
#--concurrent-fragments 4

# --- Варианты качества (замена строки -f выше) ---
# До 4K:
#-f "bv*[height<=2160]+ba/b[height<=2160]"
# До 1080p:
#-f "bv*[height<=1080]+ba/b[height<=1080]"
# До 1080p строго H.264 (старые ТВ/плееры, не читают AV1/VP9):
#-f "bv*[height<=1080][vcodec^=avc1]+ba[ext=m4a]/b[height<=1080]"
