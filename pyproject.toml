[tool.ruff]
line-length = 200
target-version = "py312"
exclude = ["backup", "testing", "__pycache__", ".ruff_cache", "build_assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E701", "E702"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.ruff.lint.per-file-ignores]
"yadpylesos.py" = ["E501"]
